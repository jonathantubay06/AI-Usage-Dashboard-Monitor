<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050c1d">
  <meta name="description" content="Track token usage and costs across AI models from one live dashboard.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AI Token Monitor">
  <meta property="og:description" content="Track token usage and costs across AI models from one live dashboard.">
  <meta property="og:image" content="/netlify-open-graph.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AI Token Monitor">
  <meta name="twitter:description" content="Track token usage and costs across AI models from one live dashboard.">
  <meta name="twitter:image" content="/netlify-open-graph.png">
  <title>AI Token Monitor</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><use href="/icon.svg#brand-mark"/></svg>
      <span>AI Token Monitor</span>
      <span id="pulse" class="pulse" title="Live connection"></span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button role="tab" data-tab="apps">Apps</button>
      <button role="tab" data-tab="models">Models</button>
      <button role="tab" data-tab="sessions">Sessions</button>
      <button role="tab" data-tab="live">Live</button>
      <button role="tab" data-tab="settings">Settings</button>
    </nav>
    <div class="ranges" role="group" aria-label="Time range">
      <button data-range="today">Today</button>
      <button data-range="7d" aria-pressed="true">7 days</button>
      <button data-range="30d">30 days</button>
      <button data-range="all">All</button>
    </div>
    <button class="btn cur-btn" id="cur-btn" aria-haspopup="dialog" title="Change currency">USD</button>
  </header>

  <main id="view" aria-live="polite"></main>

  <dialog id="login">
    <form method="dialog" id="login-form">
      <h2>Enter access token</h2>
      <p>Find it on the PC running the monitor: Settings, Access from other devices.</p>
      <input name="token" autocomplete="current-password" required aria-label="Access token">
      <p class="err" id="login-err" role="alert"></p>
      <button class="btn primary">Unlock</button>
    </form>
  </dialog>

  <dialog id="cur-dlg" aria-labelledby="cur-title">
    <div class="cur-panel">
      <h2 id="cur-title">Show costs in</h2>
      <input id="cur-q" type="search" placeholder="Search a country or currency" aria-label="Search a country or currency" autocomplete="off">
      <ul id="cur-list" class="cur-list"></ul>
      <p class="note" id="cur-note"></p>
      <button class="btn" type="button" data-cur-close>Close</button>
    </div>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
