# Public demo: the dashboard on invented data. It never reads real logs.
[build]
  command = "node scripts/build-site.mjs"
  publish = "dist-demo"
  # 2026-10-18 (no wasted rebuilds): skip the Netlify build (exit 0) when a
  # push only touches files the site never serves.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)history' ':(exclude)test' ':(exclude)README.md' ':(exclude)LICENSE' ':(exclude).gitignore' ':(exclude).gitattributes'"

[build.environment]
  NODE_VERSION = "24"
